name: windows-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Audit the hashed Windows release lock
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements-build.txt
          require-hashes: true
          no-deps: true
          internal-be-careful-extra-flags: --disable-pip

  build:
    needs: dependency-audit
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Verify source and main history
        shell: pwsh
        run: |
          $Head = (git rev-parse --verify HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $Head -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Unable to resolve the release checkout HEAD."
          }
          if ($Head -ne $env:GITHUB_SHA) {
            throw "GitHub event SHA does not match the checked-out HEAD."
          }
          $Main = (
            git rev-parse --verify "refs/remotes/origin/main^{commit}"
          ).Trim()
          if ($LASTEXITCODE -ne 0 -or $Main -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Unable to resolve origin/main."
          }
          if (
            "${{ github.event_name }}" -eq "push" -and
            "${{ github.ref_type }}" -eq "tag"
          ) {
            $Version = (
              python -c "from pet.version import APP_VERSION; print(APP_VERSION)"
            ).Trim()
            if ($env:GITHUB_REF_NAME -ne "v$Version") {
              throw (
                "Tag $env:GITHUB_REF_NAME does not match " +
                "application version v$Version."
              )
            }
            $TagTarget = (
              git rev-parse --verify "refs/tags/$env:GITHUB_REF_NAME^{commit}"
            ).Trim()
            if ($LASTEXITCODE -ne 0 -or $TagTarget -ne $Head) {
              throw "Release tag does not resolve to the checked-out HEAD."
            }
            git merge-base --is-ancestor $Head $Main
            if ($LASTEXITCODE -ne 0) {
              throw "Release tag commit is not contained in origin/main."
            }
          }
          $Dirty = git status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to verify the release checkout status."
          }
          if ($Dirty) {
            throw "Release checkout is not clean:`n$Dirty"
          }

      - name: Install locked build dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-build.txt
          python -m pip check
          python -c "import importlib.metadata as m; raise SystemExit(3 if any(d.metadata['Name'].lower().replace('_','-') == 'pyside6-addons' for d in m.distributions()) else 0)"
          python tools/check_build_environment.py

      - name: Test source and release inputs
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tools/build_icon.py
          python -m unittest discover -s tests -v
          python tools/check_sprites.py
          python tools/check_layout.py
          python tools/check_release.py

      - name: Build portable Windows application
        shell: pwsh
        run: |
          $OriginalPath = $env:PATH
          $BasePrefix = (python -c "import sys; print(sys.base_prefix)").Trim()
          $PythonDirectory = Split-Path (Get-Command python).Source
          try {
            $env:PATH = @(
              $PythonDirectory,
              $BasePrefix,
              (Join-Path $env:WINDIR "System32"),
              $env:WINDIR
            ) -join ";"
            python -m PyInstaller --clean --noconfirm MoonShell.spec
          } finally {
            $env:PATH = $OriginalPath
          }
          python tools/check_build_provenance.py
          python tools/write_build_info.py
          if (
            "${{ github.event_name }}" -eq "push" -and
            "${{ github.ref_type }}" -eq "tag"
          ) {
            python tools/check_release.py `
              --exe dist/MoonShell/MoonShell.exe `
              --require-clean-source
          } else {
            python tools/check_release.py --exe dist/MoonShell/MoonShell.exe
          }

      - name: Native packaged smoke test
        run: python tools/smoke_release.py

      - name: Validate PE metadata and package
        shell: pwsh
        run: |
          $Executable = Resolve-Path dist\MoonShell\MoonShell.exe
          $Version = (
            python -c "from pet.version import APP_VERSION; print(APP_VERSION)"
          ).Trim()
          $NumericVersion = "$Version.0"
          $Info = (Get-Item -LiteralPath $Executable).VersionInfo
          if ($Info.ProductName -ne "MoonShell Spirit") {
            throw "ProductName mismatch: $($Info.ProductName)"
          }
          if ($Info.OriginalFilename -ne "MoonShell.exe") {
            throw "OriginalFilename mismatch: $($Info.OriginalFilename)"
          }
          if ($Info.ProductVersion -notin @($Version, $NumericVersion)) {
            throw "ProductVersion mismatch: $($Info.ProductVersion)"
          }
          if ($Info.FileVersion -notin @($Version, $NumericVersion)) {
            throw "FileVersion mismatch: $($Info.FileVersion)"
          }
          if (
            "${{ github.event_name }}" -eq "push" -and
            "${{ github.ref_type }}" -eq "tag"
          ) {
            python tools/package_release.py --unsigned-release
            "### Unsigned maintenance release" >>
              $env:GITHUB_STEP_SUMMARY
            (
              "This public maintenance release is not " +
              "Authenticode-signed. SHA-256 verifies file consistency, " +
              "not publisher identity."
            ) >> $env:GITHUB_STEP_SUMMARY
          } else {
            python tools/package_release.py --qa
            "### Unsigned QA build" >> $env:GITHUB_STEP_SUMMARY
            "This artifact is unsigned and is only for QA." >>
              $env:GITHUB_STEP_SUMMARY
            "Manual workflow runs never publish a GitHub Release." >>
              $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload unsigned QA package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MoonShell-windows-x64-unsigned-qa-${{ github.sha }}
          path: |
            dist/MoonShell-*-windows-x64-unsigned-qa.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable maintenance package
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MoonShell-windows-x64-maintenance-${{ github.sha }}
          path: |
            dist/MoonShell-*-windows-x64-portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Download verified maintenance package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: MoonShell-windows-x64-maintenance-${{ github.sha }}
          path: dist

      - name: Recheck tag, checksum, and publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Release tag has an unsupported version format."
          }
          $Version = $Matches[1]
          $EventSha = $env:GITHUB_SHA.ToLowerInvariant()
          if ($EventSha -notmatch '^[0-9a-f]{40}$') {
            throw "GitHub event SHA is invalid."
          }
          $RemoteTag = (
            gh api `
              "repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_REF_NAME" `
              --jq ".sha"
          ).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $RemoteTag -ne $EventSha) {
            throw (
              "Remote release tag moved after this workflow started. " +
              "Expected $EventSha, got $RemoteTag."
            )
          }
          $RemoteMain = (
            gh api `
              "repos/$env:GITHUB_REPOSITORY/commits/main" `
              --jq ".sha"
          ).Trim().ToLowerInvariant()
          if (
            $LASTEXITCODE -ne 0 -or
            $RemoteMain -notmatch '^[0-9a-f]{40}$'
          ) {
            throw "Unable to resolve the current remote main commit."
          }
          $MainRelationship = (
            gh api `
              "repos/$env:GITHUB_REPOSITORY/compare/$EventSha...$RemoteMain" `
              --jq ".status"
          ).Trim()
          if (
            $LASTEXITCODE -ne 0 -or
            $MainRelationship -notin @("ahead", "identical")
          ) {
            throw (
              "Release tag commit is no longer contained in remote main " +
              "(relationship=$MainRelationship)."
            )
          }

          $ArchiveName = (
            "MoonShell-$Version-windows-x64-portable.zip"
          )
          $ArchivePath = Join-Path "dist" $ArchiveName
          $ManifestPath = Join-Path "dist" "SHA256SUMS.txt"
          if (
            -not (Test-Path -LiteralPath $ArchivePath -PathType Leaf) -or
            -not (Test-Path -LiteralPath $ManifestPath -PathType Leaf)
          ) {
            throw "Maintenance release artifact is incomplete."
          }
          $Manifest = (Get-Content -LiteralPath $ManifestPath -Raw).Trim()
          $Parts = $Manifest -split '  ', 2
          if (
            $Parts.Count -ne 2 -or
            $Parts[0] -notmatch '^[0-9a-f]{64}$' -or
            $Parts[1] -ne $ArchiveName
          ) {
            throw "Release checksum manifest is malformed."
          }
          $Actual = (
            Get-FileHash -LiteralPath $ArchivePath -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($Actual -ne $Parts[0]) {
            throw "Downloaded release archive checksum does not match."
          }

          $UnsignedNote = (
            "> [!WARNING]`n" +
            "> 此 Windows 便携维护版未使用 Authenticode 代码签名。Windows " +
            "首次运行时可能显示未知发布者或 SmartScreen 提示。`n" +
            "> 请只从本发布页下载，并用 SHA256SUMS.txt 核对文件；" +
            "SHA-256 校验不等同于发布者代码签名。"
          )
          gh release create $env:GITHUB_REF_NAME `
            $ArchivePath `
            $ManifestPath `
            --verify-tag `
            --generate-notes `
            --notes $UnsignedNote `
            --title "MoonShell $Version"
